<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Animated Shimmer Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .floating-node-1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: floatTwo 8s ease-in-out infinite alternate;
      }
      .floating-node-3 {
        animation: floatThree 7s ease-in-out infinite alternate;
      }
      .pulse-line {
        animation: pulseLine 4s ease-in-out infinite alternate;
      }
      .stream-particle {
        animation: flowAlong 10s linear infinite;
      }

      @keyframes floatOne {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-16px) rotate(3deg); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(18px) rotate(-4deg); }
      }
      @keyframes floatThree {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-10px, -14px); }
      }
      @keyframes pulseLine {
        0% { opacity: 0.2; stroke-width: 1.5; }
        50% { opacity: 0.7; stroke-width: 2.5; }
        100% { opacity: 0.3; stroke-width: 1.5; }
      }
      @keyframes flowAlong {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Decorative Background Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Ambient Light Orbs in Background -->
  <circle cx="150" cy="100" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="160" fill="#8b5cf6" opacity="0.09" filter="url(#glow)"/>
  <circle cx="900" cy="90" r="120" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Animated Architectural Elements (Constrained to background/edges to protect text clarity) -->
  <g class="pulse-line" stroke="url(#cyan-glow)" fill="none" stroke-dasharray="8 6" opacity="0.4">
    <path d="M 50,340 C 250,290 350,380 550,340 C 750,300 850,390 1150,330" />
    <path d="M 50,370 C 300,320 400,410 700,360 C 900,320 1000,390 1150,360" />
  </g>

  <!-- Floating Ambient Pills / Flow Cards in Background Corners -->
  <g class="floating-node-1" transform="translate(940, 50)">
    <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    <circle cx="24" cy="21" r="7" fill="#10b981"/>
    <text x="42" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ACID Transactions</text>
  </g>

  <g class="floating-node-2" transform="translate(960, 115)">
    <rect width="170" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    <circle cx="24" cy="21" r="7" fill="#38bdf8"/>
    <text x="42" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Iceberg &amp; Delta</text>
  </g>

  <g class="floating-node-3" transform="translate(920, 180)">
    <rect width="210" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    <circle cx="24" cy="21" r="7" fill="#a855f7"/>
    <text x="42" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Vector &amp; Semantic RAG</text>
  </g>

  <!-- Foreground Content: Top Meta Badges -->
  <g transform="translate(80, 75)">
    <rect width="175" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="16" y="20" class="badge-text">⚡ ENTERPRISE LEGALTECH</text>
  </g>
  <g transform="translate(268, 75)">
    <rect width="165" height="30" rx="15" fill="#4338ca" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.2"/>
    <text x="16" y="20" class="badge-text" fill="#818cf8">🏛️ CONTRACT LAKEHOUSE</text>
  </g>
  <g transform="translate(446, 75)">
    <rect width="150" height="30" rx="15" fill="#065f46" fill-opacity="0.25" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="20" class="badge-text" fill="#34d399">🌟 OPEN ARCHITECTURE</text>
  </g>

  <!-- Primary Foreground Title and Subtitle -->
  <g transform="translate(80, 160)">
    <text class="title-text" x="0" y="0">Awesome Legal &amp; Contract</text>
    <text class="title-text" x="0" y="52" fill="url(#cyan-glow)">Data Lake Architecture ⚖️ 🚀</text>
    <text class="subtitle-text" x="0" y="105">Curated directory of SaaS Lakehouses, Open-Source Engines &amp; Data Fabric</text>
    <text class="subtitle-text" x="0" y="132" fill="#64748b">Unified analytics, clause vector stores, audit lineage, and Petabyte-scale CLM intelligence</text>
  </g>

  <!-- Interactive / Modern Feature Tags Row at Bottom Foreground -->
  <g transform="translate(80, 340)">
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">📊 SEC Filings ETL</text>

    <rect x="145" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="157" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔍 Fast Parquet &amp; DuckDB</text>

    <rect x="320" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="332" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">🛡️ Governance &amp; RBAC</text>

    <rect x="490" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="502" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1">📑 Deep Clause RAG</text>
  </g>
</svg>
